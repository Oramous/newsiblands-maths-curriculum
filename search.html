<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Curriculum Search | New Sibs Maths</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="data.js"></script>

<style>

:root{
    --navy:#003B5C;
    --blue:#0077B6;
    --green:#5CB85C;
    --purple:#7B5CB8;
    --light:#F5F7FA;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:var(--light);
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#003B5C;
    color:white;
    position:fixed;
    height:100%;
    overflow-y:auto;
    padding:20px;
}

.logo{
    text-align:center;
}

.logo img{
    width:120px;
    margin-bottom:10px;
}

.sidebar h2{
    text-align:center;
}

.sidebar p{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    color:white;
    text-decoration:none;
    display:block;
    padding:12px;
    border-radius:8px;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.15);
}

/* MAIN */

.main{
    margin-left:260px;
    padding:30px;
}

h1{
    color:#003B5C;
    margin-bottom:20px;
}

.search-box{
    width:100%;
    padding:15px;
    border:2px solid #ddd;
    border-radius:10px;
    margin-bottom:25px;
    font-size:16px;
}

.result{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.result h3{
    color:#003B5C;
    margin-bottom:10px;
}

.result p{
    margin-bottom:8px;
}

.open-link{
    display:inline-block;
    margin-top:10px;
    padding:8px 12px;
    border-radius:8px;
    background:#0077B6;
    color:white;
    text-decoration:none;
}

.open-link:hover{
    background:#005d94;
}

@media(max-width:1000px){

    .sidebar{
        width:100%;
        position:relative;
        height:auto;
    }

    .main{
        margin-left:0;
    }

}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <img src="logo.png" alt="School Logo">

        <h2>New Siblands</h2>

        <p>Mathematics Curriculum</p>

    </div>

    <a href="index.html">🏠 Home</a>

    <a href="Curriculum.html">
        📚 Curriculum Documents
    </a>

    <a href="ehcp-long.html">
        🧩 EHCP Target Finder
    </a>

    <a href="Assessment.html">
        📊 Assessment
    </a>

    <a href="WhiteRose.html">
        📖 White Rose Links
    </a>

</div>

<div class="main">

    <h1>Curriculum Search</h1>

    <input
        type="text"
        id="searchBox"
        class="search-box"
        placeholder="Search targets, strands, vocabulary, learning areas, focus areas or EHCP targets..."
        onkeyup="runSearch()"
    >

    <div id="results"></div>

</div>

<script>

let allData = [];

const focusNames = {

    "Size" : "Length & Height",

    "Weight" : "Weight & Mass",

    "Capacity" : "Capacity",

    "Time" : "Time",

    "Money" : "Money"

};

async function initialise(){

    allData = await loadCurriculum();

    const params =
    new URLSearchParams(window.location.search);

    const q =
    params.get('q');

    if(q){

        document
        .getElementById('searchBox')
        .value = q;

        runSearch();

    }

}

function runSearch(){

    const search =
    document
    .getElementById('searchBox')
    .value
    .toLowerCase()
    .trim();

    if(search.length === 0){

        document
        .getElementById('results')
        .innerHTML = '';

        return;

    }

    let html = '';

    const results =
    allData.filter(item => {

        let text = [

            item.Target,
            item.Strand,
            item['Long term EHCP Target'],
            item['Learning Area'],
            item['Focus area'],
            item.Breakdown,
            item.Activities,
            item.Vocab

        ].join(' ').toLowerCase();

        return text.includes(search);

    });

    results.forEach(item => {

        html += `

<div class="result">

<details>

<summary>

${item.Target}

</summary>

<p>
<strong>Subject:</strong>
${item.Subject}
</p>

<p>
<strong>Strand:</strong>
${item.Strand}
</p>

<p>
<strong>Stage:</strong>
${item.Level}
</p>

${
item['Focus area']
?
`
<p>
<strong>Focus Area:</strong>
${item['Focus area']}
</p>
`
:
''
}

${
item['Learning Area']
?
`
<p>
<strong>Learning Area:</strong>
${item['Learning Area']}
</p>
`
:
''
}

${
item['Long term EHCP Target']
?
`
<p>
<strong>Long-Term EHCP Target:</strong>
${item['Long term EHCP Target']}
</p>
`
:
''
}

${
item.Breakdown
?
`
<p>

<strong>Target Breakdown</strong>

<br>

${item.Breakdown}

</p>
`
:
''
}

${
item.Emerging
?
`
<p>

<strong>Emerging</strong>

<br>

${item.Emerging}

</p>
`
:
''
}

${
item.Developing
?
`
<p>

<strong>Developing</strong>

<br>

${item.Developing}

</p>
`
:
''
}

${
item.Secure
?
`
<p>

<strong>Secure</strong>

<br>

${item.Secure}

</p>
`
:
''
}

${
item.Activities
?
`
<p>

<strong>Activities</strong>

<br>

${item.Activities}

</p>
`
:
''
}

${
item.Vocab
?
`
<p>

<strong>Vocabulary</strong>

<br>

${item.Vocab}

</p>
`
:
''
}

<a
class="open-link"
href="view.html?strand=${encodeURIComponent(item.Strand)}#target-${item.ID}">

Open in Curriculum Page

</a>

</details>

</div>

`;

    });

    if(results.length === 0){

        html = `

        <div class="result">

            No matches found.

        </div>

        `;

    }

    document
    .getElementById('results')
    .innerHTML = html;

}

initialise();

</script>

</body>

</html>
