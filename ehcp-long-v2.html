<label><input type="checkbox" class="stageFilter" value="6"> 6</label>
<label><input type="checkbox" class="stageFilter" value="7"> 7</label>
<label><input type="checkbox" class="stageFilter" value="8"> 8</label>
<label><input type="checkbox" class="stageFilter" value="9"> 9</label>
<label><input type="checkbox" class="stageFilter" value="10"> 10</label>

</div>

Loading strands...

</div>

</div>

type="text"
id="searchBox"
class="search-box"
placeholder="Search EHCP targets...">

</div>

</div>

</div>

<script>

let allData = [];

async function initialise(){

    allData =
    await loadCurriculum();

    buildStrandFilters();

    buildResults();

}
    
function buildStrandFilters(){
    
let strands =
[...new Set(

allData.flatMap(row => {

let primary = row.Strand
? row.Strand.split('|')
: [];

let secondary =
row['Secondary Strands']
? row['Secondary Strands'].split('|')
: [];

return [...primary,...secondary];

})

)]
.map(x => x.trim())
.filter(Boolean)
.sort();

let html = '';

strands.forEach(strand => {

html += `

<label>

<input
type="checkbox"
class="strandFilter"
value="${strand}">

${strand}

</label>

`;

});

document
.getElementById('strandFilters')
.innerHTML = html;

}    

function buildResults(){

let html = '';

let targetMap = {};

allData.forEach(row => {

if(!row['Long term EHCP Target'])
return;

row['Long term EHCP Target']
.split('|')
.map(x => x.trim())
.forEach(target => {

if(!targetMap[target]){

targetMap[target] = [];

}

targetMap[target].push(row);

});

});

let targets =
Object.entries(targetMap)
.map(([target, rows]) => {

const levels =
rows.map(row =>
Number(row.Level)
);

const primaryStrand =
rows[0].Strand;

return {

target,
rows,

minStage:
Math.min(...levels),

maxStage:
Math.max(...levels),

primaryStrand

};

})
.sort((a,b)=>{

if(a.minStage !== b.minStage){

return a.minStage - b.minStage;

}

if(a.maxStage !== b.maxStage){

return a.maxStage - b.maxStage;

}

return a.primaryStrand.localeCompare(
b.primaryStrand
);

});

let currentRange = '';

targets.forEach(item => {

const range =

item.minStage === item.maxStage

?

`Stage ${item.minStage}`

:

`Stage ${item.minStage}-${item.maxStage}`;

if(range !== currentRange){

html += `

<div class="stage-heading">

${range}

</div>

`;

currentRange = range;

}

html += `

<div class="result-card ehcp-card">

<details>

<summary>

${item.target}

</summary>

<p>

<strong>Stage Range:</strong>

${range}

</p>

<p>

<strong>Primary Strand:</strong>

${item.primaryStrand}

</p>

${
item.secondaryStrands.length
?
`
<p>

<strong>Additional Strands:</strong>

${item.secondaryStrands.join(', ')}

</p>
`
:
''
}

<div class="section-badge ehcp-badge">
Associated Curriculum Targets
</div>

`;

item.rows
.sort((a,b)=>
Number(a.Level)
-
Number(b.Level)
)
.forEach(row => {

html += `

<details>

<summary>

Stage ${row.Level}

-

${row.Target}

</summary>

<div class="target-box">

${row.Breakdown ? `
<p><strong>Target Breakdown</strong><br>
${row.Breakdown}</p>
` : ''}

${row['Linked EHCP Areas'] ? `
<p>

<strong>Linked EHCP Areas</strong>

<br>

${row['Linked EHCP Areas']}

</p>
` : ''}

</div>

</details>

`;

});

html += `

</details>

</div>

`;

});
    
document.getElementById('results')
.innerHTML = html;

applyFilters();

}

function applyFilters(){

let search =
document.getElementById('searchBox')
.value
.toLowerCase();

document
.querySelectorAll('.ehcp-card')
.forEach(card => {

if(
card.innerText
.toLowerCase()
.includes(search)
){

card.style.display='';

}
else{

card.style.display='none';

}

});

}    
    
initialise();

</script>
