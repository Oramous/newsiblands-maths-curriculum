<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Long-Term EHCP Targets</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="data.js"></script>

<style>

body{
font-family:Segoe UI,sans-serif;
background:#F5F7FA;
padding:30px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h1,h2,h3{
color:#003B5C;
}

details{
margin-top:10px;
}

summary{
cursor:pointer;
font-weight:bold;
}

:root{
--navy:#003B5C;
--blue:#0077B6;
--green:#5CB85C;
--purple:#7B5CB8;
--light:#F5F7FA;
}

body{
font-family:Segoe UI,sans-serif;
background:var(--light);
padding:30px;
}

.subject-heading{

background:#003B5C;
color:white;

padding:15px;

border-radius:10px;

font-size:28px;
font-weight:bold;

margin-top:30px;
margin-bottom:20px;

}

.pathway-heading{

display:inline-block;

padding:8px 15px;

background:#0077B6;
color:white;

border-radius:20px;

font-weight:bold;

margin-bottom:15px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

margin-bottom:20px;

}

.target-card{

background:white;

padding:15px;

border-radius:12px;

box-shadow:0 2px 6px rgba(0,0,0,.08);

margin-bottom:12px;

}

details{

margin-top:10px;

}

summary{

cursor:pointer;

font-weight:bold;

color:#003B5C;

}

h1{

color:#003B5C;

}
  
</style>

</head>

<body>

<h1>Browse by Long-Term EHCP Target</h1>

<div id="content"></div>

<script>

async function buildPage(){

const data =
await loadCurriculum();

const params =
new URLSearchParams(window.location.search);

const selected =
params.get("target");

let html = "";

if(selected){

let matching =
data.filter(item =>
item['Long term EHCP Target'] === selected
);

let first = matching[0];

html += `
<div class="card">

<h2>${selected}</h2>

<p><strong>Subject:</strong> ${first.Subject}</p>

<p><strong>Strand:</strong> ${first.Strand}</p>

<p><strong>Learning Area:</strong> ${first['Learning Area']}</p>

<p>
<strong>Stage Range:</strong>

${Math.min(...matching.map(x=>Number(x.Level)))}
-
${Math.max(...matching.map(x=>Number(x.Level)))}

</p>

</div>
`;

matching
.sort((a,b)=>Number(a.Level)-Number(b.Level))
.forEach(item=>{

html += `

<div class="target-card">

<details>

<summary>

Stage ${item.Level}

-

${item.Target}

</summary>

<p>

<strong>Subject:</strong>

${item.Subject}

</p>

<p>

<strong>Strand:</strong>

${item.Strand}

</p>

<p>

<strong>Learning Area:</strong>

${item['Learning Area'] || ''}

</p>

<p>

<a href="view.html?strand=${encodeURIComponent(item.Strand)}">

View full target information

</a>

</p>

</details>

</div>

`;

});

}
else{

const subjects = [...new Set(
data.map(x => x.Subject)
)];

subjects.forEach(subject => {

html += `
<div class="subject-heading">
${subject}
</div>
`;

const subjectRows =
data.filter(x => x.Subject === subject);

const pathways = [...new Set(
subjectRows.map(x => x.Pathway)
)];

pathways.forEach(pathway => {

html += `
<div class="pathway-heading">
${pathway}
</div>
`;

const pathwayRows =
subjectRows.filter(x => x.Pathway === pathway);

const strands = [...new Set(
pathwayRows.map(x => x.Strand)
)];

strands.forEach(strand => {

const strandRows =
pathwayRows.filter(x => x.Strand === strand);

const minStage = Math.min(
...strandRows.map(x => Number(x.Level))
);

const maxStage = Math.max(
...strandRows.map(x => Number(x.Level))
);

html += `

<div class="card">

<h3>${strand}</h3>

<p>

<strong>Stage Range:</strong>

${minStage}-${maxStage}

<br>

<strong>Learning Area:</strong>

${strandRows[0]['Learning Area'] || ''}

</p>

`;

const targets = [...new Set(
strandRows.map(
x => x['Long term EHCP Target']
)
)];

targets.forEach(target => {

html += `

<details>

<summary>

${target}

</summary>

<p>

<a href="?target=${encodeURIComponent(target)}">

Open Long-Term Target

</a>

</p>

</details>

`;

});

html += `

</div>

`;

});

});

});

}

document.getElementById("content").innerHTML = html;

}

buildPage();

</script>

</body>

</html>
