<style>

:root{
--navy:#003B5C;
--blue:#0077B6;
--green:#5CB85C;
--purple:#7B5CB8;
--light:#F5F7FA;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}
    
body{
margin:0;
padding:0;
background:var(--light);
}

}

.back{

padding:10px 15px;

}

margin-bottom:30px;
}

.level-title{

color:white;

border-radius:10px;

}

details{
background:white;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

summary{
padding:15px;
font-weight:bold;
cursor:pointer;
}

.content{
padding:20px;
}

.section-title{

}

.tag{

}

.pathway{

color:white;
font-weight:bold;
margin-bottom:15px;
}

.belonging{
background:var(--green);
}

.achievement{
background:var(--blue);
}

.celebration{

}

.jump{

display:inline-block;
margin-right:10px;
padding:10px 15px;
background:#003B5C;
color:white;
text-decoration:none;
border-radius:10px;
margin-bottom:20px;

}

.white-rose-btn{

display:inline-block;
padding:12px 18px;
background:#0077B6;
color:white;
text-decoration:none;
border-radius:10px;
margin-top:10px;

}

.search-box{

width:100%;
padding:12px;
margin-bottom:20px;
border-radius:10px;
border:2px solid #ddd;

}

.intro-box{

background:white;
padding:25px;
border-radius:15px;
margin-bottom:25px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.intro-box h2{

color:#003B5C;
margin-top:20px;
margin-bottom:10px;

}

.intro-box ul{

padding-left:20px;

}

.intro-box li{

margin-bottom:8px;

}

.section-badge{

display:inline-block;

padding:6px 14px;

border-radius:20px;

font-weight:bold;

margin-top:15px;
margin-bottom:10px;

color:white;

}

.breakdown-badge{
background:#003B5C;
}

.emerging-badge{
background:#5CB85C;
}

.developing-badge{
background:#F0AD4E;
}

.secure-badge{
background:#0077B6;
}

.activities-badge{
background:#6F42C1;
}

.vocab-badge{
background:#17A2B8;
}

.resources-badge{
background:#6C757D;
}

.whiterose-badge{
background:#E83E8C;
}

.misconceptions-badge{
background:#DC3545;
}

.ehcp-badge{
background:#20C997;
}

.nextsteps-badge{
background:#8C564B;
}

.sidebar{
    width:260px;
    background:#003B5C;
    color:white;
    position:fixed;
    height:100%;
    overflow-y:auto;
    padding:20px;
}

.logo{
    text-align:center;
}

.logo img{
    width:120px;
    margin-bottom:10px;
}

.sidebar h2{
    text-align:center;
}

.sidebar p{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    color:white;
    text-decoration:none;
    display:block;
    padding:12px;
    border-radius:8px;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.15);
}

.main{
margin-left:260px;
padding:30px;
width:calc(100% - 260px);
}

.foundation-banner{

background:#5CB85C;
color:white;

padding:15px;

border-radius:10px;

font-size:22px;
font-weight:bold;

margin-top:20px;
margin-bottom:20px;

}

.achievement-banner{

background:#0077B6;
color:white;

padding:15px;

border-radius:10px;

font-size:22px;
font-weight:bold;

margin-top:20px;
margin-bottom:20px;

}  

.celebration-banner{

background:#7B5CB8;
color:white;

padding:15px;

border-radius:10px;

font-size:22px;
font-weight:bold;

margin-top:20px;
margin-bottom:20px;

}
    
</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<img src="logo.png" alt="School Logo">

<h2>New Siblands</h2>

<p>Mathematics Curriculum</p>

</div>

<a href="index.html">🏠 Home</a>

<a href="Curriculum.html">
📚 Curriculum Documents
</a>

<a href="ehcp-long.html">
🧩 EHCP Target Finder
</a>

<a href="Assessment.html">
📊 Assessment
</a>

<a href="WhiteRose.html">
📖 White Rose Links
</a>

<a href="teachingassistant.html">
🤖 Teaching Assistant
</a>
    
</div>

<div class="main">

<a href="index.html" class="back">
← Back to Homepage
</a>

<h1 id="strandTitle"></h1>

<div id="strandIntro"></div>

<div id="levelNav"></div>

<input
type="text"
id="targetSearch"
placeholder="Search this strand..."
class="search-box"
onkeyup="searchTargets()">
  
<div id="curriculum"></div>

<script>

const focusNames = {

    "Size" : "Length & Height",

    "Weight" : "Weight & Mass",

    "Capacity" : "Capacity",

    "Time" : "Time",

    "Money" : "Money"

};
    
async function buildPage(){

const params =
new URLSearchParams(window.location.search);

const strand =
params.get('strand');

const cycle =
params.get('cycle');

const term =
params.get('term');
  
const pathway =
params.get('pathway');
  
const focus =
params.get('focus');
    
if(strand && focus){

document.getElementById('strandTitle').innerText =
strand + ' - ' +

(
focusNames[focus]
||
focus
);

}
else if(strand && pathway){

document.getElementById('strandTitle').innerText =
strand + ' (' + pathway + ')';

}
else if(strand){

document.getElementById('strandTitle').innerText =
strand + ' Strand';

}
else if(pathway){

document.getElementById('strandTitle').innerText =
pathway + ' Pathway';

}

if(pathway){

document.getElementById('levelNav').style.display = 'none';

}

else if(cycle && term){

document.getElementById('strandTitle').innerText =
'Cycle ' + cycle + ' - Term ' + term;

}

const data =
await loadCurriculum();

const strandInfo =
await loadStrandInfo();

console.log(data);

const container =
document.getElementById('curriculum');

if(strand){

    const info = strandInfo.find(x =>

        x.Strand &&
        x.Strand.trim().toLowerCase() ===
        strand.trim().toLowerCase()

    );

    if(info){

        document.getElementById('strandIntro').innerHTML = `

<div class="intro-box">

${
focus
?
`
<div class="section-badge breakdown-badge">
Focus Area
</div>

<p>
${focusNames[focus] || focus}
</p>
`
:
''
}

${
strand === 'Pre-Formal Mathematics'
?
`
<div style="text-align:center; margin-bottom:25px;">

<img
src="Roots of maths.png"
alt="Roots of Maths"
style="
max-width:100%;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
">

</div>
`
:
''
}

    <h2>Introduction</h2>

    <p>
    ${info['Introduction'] || ''}
    </p>

    ${
    info['Why is it important?']
    ?
    `
    <h2>Why is it important?</h2>

    <p>
    ${info['Why is it important?']}
    </p>
    `
    :
    ''
    }

    ${
    info['Pathway Aim']
    ?
    `
    <h2>Pathway Aim</h2>

    <p>
    ${info['Pathway Aim']}
    </p>
    `
    :
    ''
    }

    ${
    info['Example evidence statements']
    ?
    `
    <h2>Example Evidence Statements</h2>

    <ul>

    ${
    info['Example evidence statements']
        .split('|')
        .map(x => `<li>${x.trim()}</li>`)
        .join('')
    }

    </ul>
    `
    :
    ''
    }

   ${
info['Learning Areas']
?
`
<h2>Learning Areas</h2>

${
info['Flowchart']
?
`
<div style="text-align:center; margin:20px 0;">

<img
src="${info['Flowchart']}"
style="
max-width:100%;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
">

</div>
`
:
''
}

<ul>

${
info['Learning Areas']
    .split('|')
    .map(x => `<li>${x.trim()}</li>`)
    .join('')
}

</ul>
`
:
''
}

</div>

`;

    }

}
  
let filtered = data;

if(strand){

filtered = filtered.filter(item =>

item.Strand &&

item.Strand
.toLowerCase()
.split('|')
.map(x => x.trim())
.includes(
strand.toLowerCase()
)

);

}

if(pathway){

filtered = filtered.filter(item =>
item.Pathway &&
item.Pathway.toLowerCase()
.includes(pathway.toLowerCase())
);

}

if(focus){

filtered = filtered.filter(item =>

item['Focus area'] &&

item['Focus area']
.toLowerCase()
.split('|')
.map(x => x.trim())
.includes(focus.toLowerCase())

);

}
    
if(pathway && !strand){

let strands = [...new Set(
  
filtered.map(item =>
item.Subject + "|" + item.Strand)

)];

let html = "";

let numberStrands =
strands.filter(x =>
x.startsWith("Number|"));

let ssmStrands =
strands.filter(x =>
x.startsWith("SSM|"));

html += `
<h2>Number</h2>
`;

numberStrands.forEach(item=>{

let parts = item.split("|");

html += `

<div class="card">

<a href="view.html?strand=${encodeURIComponent(parts[1])}&pathway=${encodeURIComponent(pathway)}">

${parts[1]}

</a>

</div>

`;

});

html += `
<h2>Shape, Space &amp; Measure</h2>
`;

ssmStrands.forEach(item=>{

let parts = item.split("|");

html += `

<div class="card">

<a href="view.html?strand=${encodeURIComponent(parts[1])}&pathway=${encodeURIComponent(pathway)}">

${parts[1]}

</a>

</div>

`;

});

container.innerHTML = html;

return;

}
  
if(cycle){

filtered = filtered.filter(item =>
item.Cycle == cycle
);

}

if(term){

filtered = filtered.filter(item =>
item.Term == term
);

}

let html = '';

const levels = [...new Set(
filtered.map(item => Number(item.Level))
)].sort((a,b)=>a-b);

const hasBelonging =
levels.some(level => level <= 3);

const hasAchievement =
levels.some(level => level >= 4 && level <= 7);

const hasCelebration =
levels.some(level => level >= 8);
    
levels.forEach(level => {

let levelTargets =
filtered.filter(item =>
Number(item.Level) === level
);

if(levelTargets.length === 0){
    return;
}

if(
hasBelonging &&
level === Math.min(
...levels.filter(x => x <= 3)
)
){

html += `
<div class="foundation-banner">

🟢 Belonging Foundations

</div>
`;

}

if(
hasAchievement &&
level === Math.min(
...levels.filter(x => x >= 4 && x <= 7)
)
){

html += `
<div class="achievement-banner">

🔵 Achievement Curriculum

</div>
`;

}

if(
hasCelebration &&
level === Math.min(
...levels.filter(x => x >= 8)
)
){

html += `
<div class="celebration-banner">

🟣 Celebration Curriculum

</div>
`;

}
    
html += `
<div class="level" id="stage${level}">

<div class="level-title">
Stage ${level}
</div>
`;

levelTargets.forEach(item=>{

let pathwayClass = 'achievement';

if(item.Pathway.toLowerCase().includes('belong')){
    pathwayClass = 'belonging';
}

if(item.Pathway.toLowerCase().includes('celebr')){
    pathwayClass = 'celebration';
}

html += `

<details id="target-${item.ID}">

<summary>
${item.Target}
</summary>

<div class="content">

<div class="pathway ${pathwayClass}">
${item.Pathway}
</div>

${
item.Breakdown
?
`
<div class="section-badge breakdown-badge">
🎯 Target Breakdown
</div>

<p>${item.Breakdown}</p>
`
:
''
}

${
item.Emerging
?
`
<div class="section-badge emerging-badge">
🟢 Emerging
</div>

<p>${item.Emerging}</p>
`
:
''
}

${
item.Developing
?
`
<div class="section-badge developing-badge">
🟡 Developing
</div>

<p>${item.Developing}</p>
`
:
''
}

${
item.Secure
?
`
<div class="section-badge secure-badge">
🔵 Secure
</div>

<p>${item.Secure}</p>
`
:
''
}

${
item.Activities
?
`
<div class="section-badge activities-badge">
🎲 Suggested Activities
</div>

<ul>
${
item.Activities
.split("|")
.map(x => `<li>${x.trim()}</li>`)
.join("")
}
</ul>
`
:
''
}

${
item.Vocab
?
`
<div class="section-badge vocab-badge">
🗣 Vocabulary
</div>

${
item.Vocab
.split("|")
.map(word =>
`<span class="tag">${word.trim()}</span>`
)
.join("")
}
`
:
''
}

${
item.Resources
?
`
<div class="section-badge resources-badge">
📚 Resources
</div>

<p>${item.Resources}</p>
`
:
''
}

${
item['White Rose']
?
`
<div class="section-badge whiterose-badge">
📖 White Rose
</div>

<p>

<a
href="${item['White Rose']}"
target="_blank"
class="white-rose-btn">

📖 White Rose Resource

</a>

</p>
`
:
''
}

${
item.Misconceptions
?
`
<div class="section-badge misconceptions-badge">
⚠️ Common Misconceptions
</div>

<p>${item.Misconceptions}</p>
`
:
''
}

${
item['Linked EHCP Areas']
?
`
<div class="section-badge ehcp-badge">
🔗 Linked EHCP Areas
</div>

${
item['Linked EHCP Areas']
.split('|')
.map(area =>
`<span class="tag">${area.trim()}</span>`
)
.join('')
}
`
:
''
}

${
item.Cycle || item.Term
?
`
<div class="section-badge breakdown-badge">
📅 Curriculum Cycle
</div>

<p>
Cycle ${item.Cycle}
Term ${item.Term}
</p>
`
:
''
}

${
item['Long term EHCP Target']
?
`
<div class="section-badge ehcp-badge">
🧩 Long Term EHCP Target
</div>

<details>

<summary>

${item['Long term EHCP Target']}

</summary>

<div class="target-box">

<p>

<strong>Strand:</strong>

${item.Strand}

</p>

<p>

<strong>Learning Area:</strong>

${item['Learning Area'] || ''}

</p>

<p>

<strong>Stage Range:</strong>

Stage ${Math.min(
...filtered
.filter(x =>
x['Long term EHCP Target'] === item['Long term EHCP Target']
)
.map(x => Number(x.Level))
)}
-
Stage ${Math.max(
...filtered
.filter(x =>
x['Long term EHCP Target'] === item['Long term EHCP Target']
)
.map(x => Number(x.Level))
)}

</p>

<div class="section-badge ehcp-badge">
Associated Targets
</div>

${
filtered
.filter(x =>
x['Long term EHCP Target'] === item['Long term EHCP Target']
)
.sort((a,b)=>Number(a.Level)-Number(b.Level))
.map(x =>

`

<details>

<summary>

Stage ${x.Level}

-

${x.Target}

</summary>

<div class="target-box">

${
x.Breakdown
?
`
<div class="section-badge breakdown-badge">
🎯 Target Breakdown
</div>

<p>${x.Breakdown}</p>
`
:
''
}

${
x['Linked EHCP Areas']
?
`
<div class="section-badge ehcp-badge">
🔗 Linked EHCP Areas
</div>

${
x['Linked EHCP Areas']
.split('|')
.map(area =>
`<span class="tag">${area.trim()}</span>`
)
.join('')
}
`
:
''
}

${
x.Emerging
?
`
<div class="section-badge emerging-badge">
🟢 Emerging
</div>

<p>${x.Emerging}</p>
`
:
''
}

${
x.Developing
?
`
<div class="section-badge developing-badge">
🟡 Developing
</div>

<p>${x.Developing}</p>
`
:
''
}

${
x.Secure
?
`
<div class="section-badge secure-badge">
🔵 Secure
</div>

<p>${x.Secure}</p>
`
:
''
}

${
x.Activities
?
`
<div class="section-badge activities-badge">
🎲 Suggested Activities
</div>

<ul>
${
x.Activities
.split("|")
.map(a => `<li>${a.trim()}</li>`)
.join("")
}
</ul>
`
:
''
}

${
x.Vocab
?
`
<div class="section-badge vocab-badge">
🗣 Vocabulary
</div>

${
x.Vocab
.split("|")
.map(word =>
`<span class="tag">${word.trim()}</span>`
)
.join("")
}
`
:
''
}

</div>

</details>

`
)
.join("")
}

</div>

</details>
`
:
''
}


${
item['Next Steps within level']
?
`
<div class="section-badge nextsteps-badge">
🚀 Next Steps Within Stage
</div>

<p>
${item['Next Steps within level']}
</p>
`
:
''
}

</div>

</details>

`;

});

html += '</div>';

});

document.getElementById('levelNav').innerHTML =
levels.map(level =>

`<a href="#stage${level}" class="jump">
Stage ${level}
</a>`

).join('');
container.innerHTML = html;

}
 
buildPage();

window.addEventListener('load', () => {

const hash = window.location.hash;

if(hash){

setTimeout(() => {

const target =
document.querySelector(hash);

if(target){

target.open = true;

target.scrollIntoView({
behavior:'smooth',
block:'start'
});

}

},500);

}

});

function searchTargets(){

let search =
document.getElementById('targetSearch')
.value
.toLowerCase();

document
.querySelectorAll('details')
.forEach(item=>{

if(
item.innerText
.toLowerCase()
.includes(search)
){

item.style.display='';

}
else{

item.style.display='none';

}

});

}
  
</script>

</div>  
  
</body>

</html>
