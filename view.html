<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Curriculum Strand | New Sibs Maths</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
<link rel="icon" type="image/png" href="favicon.png">
    
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="data.js"></script>

<style>

:root{
--navy:#003B5C;
--blue:#0077B6;
--green:#5CB85C;
--purple:#7B5CB8;
--light:#F5F7FA;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}
    
body{
margin:0;
padding:0;
background:var(--light);
}

h1{
color:var(--navy);
}

.back{
display:inline-block;
padding:10px 15px;
background:var(--navy);
color:white;
text-decoration:none;
border-radius:8px;
margin-bottom:20px;
}

.level{
margin-bottom:30px;
}

.level-title{
background:var(--navy);
color:white;
padding:15px;
border-radius:10px;
font-size:22px;
margin-bottom:10px;
}

details{
background:white;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

summary{
padding:15px;
font-weight:bold;
cursor:pointer;
}

.content{
padding:20px;
}

.section-title{
margin-top:15px;
color:var(--navy);
}

.tag{
display:inline-block;
padding:6px 12px;
background:#e6f2fb;
margin:3px;
border-radius:20px;
}

.pathway{
display:inline-block;
padding:6px 14px;
border-radius:20px;
color:white;
font-weight:bold;
margin-bottom:15px;
}

.belonging{
background:var(--green);
}

.achievement{
background:var(--blue);
}

.celebration{
background:var(--purple);
}

.jump{

display:inline-block;
margin-right:10px;
padding:10px 15px;
background:#003B5C;
color:white;
text-decoration:none;
border-radius:10px;
margin-bottom:20px;

}

.white-rose-btn{

display:inline-block;
padding:12px 18px;
background:#0077B6;
color:white;
text-decoration:none;
border-radius:10px;
margin-top:10px;

}

.search-box{

width:100%;
padding:12px;
margin-bottom:20px;
border-radius:10px;
border:2px solid #ddd;

}

.intro-box{

background:white;
padding:25px;
border-radius:15px;
margin-bottom:25px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.intro-box h2{

color:#003B5C;
margin-top:20px;
margin-bottom:10px;

}

.intro-box ul{

padding-left:20px;

}

.intro-box li{

margin-bottom:8px;

}

.section-badge{

display:inline-block;

padding:6px 14px;

border-radius:20px;

font-weight:bold;

margin-top:15px;
margin-bottom:10px;

color:white;

}

.breakdown-badge{
background:#003B5C;
}

.emerging-badge{
background:#5CB85C;
}

.developing-badge{
background:#F0AD4E;
}

.secure-badge{
background:#0077B6;
}

.activities-badge{
background:#6F42C1;
}

.vocab-badge{
background:#17A2B8;
}

.resources-badge{
background:#6C757D;
}

.whiterose-badge{
background:#E83E8C;
}

.misconceptions-badge{
background:#DC3545;
}

.ehcp-badge{
background:#20C997;
}

.nextsteps-badge{
background:#8C564B;
}

.sidebar{
    width:260px;
    background:#003B5C;
    color:white;
    position:fixed;
    height:100%;
    overflow-y:auto;
    padding:20px;
}

.logo{
    text-align:center;
}

.logo img{
    width:120px;
    margin-bottom:10px;
}

.sidebar h2{
    text-align:center;
}

.sidebar p{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    color:white;
    text-decoration:none;
    display:block;
    padding:12px;
    border-radius:8px;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.15);
}

.main{
margin-left:260px;
padding:30px;
width:calc(100% - 260px);
}

.foundation-banner{

background:#5CB85C;
color:white;

padding:15px;

border-radius:10px;

font-size:22px;
font-weight:bold;

margin-top:20px;
margin-bottom:20px;

}

.achievement-banner{

background:#0077B6;
color:white;

padding:15px;

border-radius:10px;

font-size:22px;
font-weight:bold;

margin-top:20px;
margin-bottom:20px;

}  

.celebration-banner{

background:#7B5CB8;
color:white;

padding:15px;

border-radius:10px;

font-size:22px;
font-weight:bold;

margin-top:20px;
margin-bottom:20px;

}

.assessment-level{
    margin-left:20px;
}

.content p{
    margin-bottom:12px;
    line-height:1.6;
}

.content ul{
    margin-bottom:16px;
}

.content strong{
    margin-bottom:0;
}

.assessment-level{
    margin-left:25px;
    margin-bottom:15px;
}

.target-box{
    margin-top:10px;
}

.target-box details{
    margin-top:12px;
}

.content ul,
.target-box ul{
    margin-left:22px;
    padding-left:0;
}

.section-content{
    margin-left:22px;
    margin-top:4px;
}    
    
</style>

</head>

<body>

<div id="sidebar-container"></div>

<div class="main">

<a href="index.html" class="back">
← Back to Homepage
</a>

<h1 id="strandTitle"></h1>

<div id="strandIntro"></div>

<div id="levelNav"></div>

<input
type="text"
id="targetSearch"
placeholder="Search this strand..."
class="search-box"
onkeyup="searchTargets()">
  
<div id="curriculum"></div>

<script>

const focusNames = {

    "Size" : "Length & Height",

    "Weight" : "Weight & Mass",

    "Capacity" : "Capacity",

    "Time" : "Time",

    "Money" : "Money"

};
    
async function buildPage(){

const params =
new URLSearchParams(window.location.search);

const strand =
params.get('strand');

const cycle =
params.get('cycle');

const term =
params.get('term');
  
const pathway =
params.get('pathway');
  
const focus =
params.get('focus');
    
if(strand && focus){

document.getElementById('strandTitle').innerText =
strand + ' - ' +

(
focusNames[focus]
||
focus
);

}
else if(strand && pathway){

document.getElementById('strandTitle').innerText =
strand + ' (' + pathway + ')';

}
else if(strand){

document.getElementById('strandTitle').innerText =
strand + ' Strand';

}
else if(pathway){

document.getElementById('strandTitle').innerText =
pathway + ' Pathway';

}

if(pathway){

document.getElementById('levelNav').style.display = 'none';

}

else if(cycle && term){

document.getElementById('strandTitle').innerText =
'Cycle ' + cycle + ' - Term ' + term;

}

const data =
await loadCurriculum();

const strandInfo =
await loadStrandInfo();

const cycleInfo =
await loadCurriculumCycle();
    
const container =
document.getElementById('curriculum');

if(strand){

    const info = strandInfo.find(x =>

        x.Strand &&
        x.Strand.trim().toLowerCase() ===
        strand.trim().toLowerCase()

    );

    if(info){

        document.getElementById('strandIntro').innerHTML = `

<div class="intro-box">

${
focus
?
`
<p><strong>🎯 Focus Area</strong></p>

<p>
${focusNames[focus] || focus}
</p>
`
:
''
}

${
strand === 'Pre-Formal Mathematics'
?
`
<div style="
float:right;
width:50%;
max-width:350px;
margin:0 0 20px 25px;
">

<img
src="Roots of maths.png"
alt="Roots of Maths"
style="
width:100%;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
">

</div>
`
:
''
}

    <h2>Introduction</h2>

    <p>
    ${info['Introduction'] || ''}
    </p>

    ${
    info['Why is it important?']
    ?
    `
    <h2>Why is it important?</h2>

    <ul>

${info['Why is it important?']
.split('|')
.map(x => `<li>${x.trim()}</li>`)
.join('')}

</ul>

    `
    :
    ''
    }

    ${
    info['Pathway Aim']
    ?
    `
    <h2>Pathway Aim</h2>

    <p>
    ${info['Pathway Aim']}
    </p>
    `
    :
    ''
    }

    ${
    info['Example evidence statements']
    ?
    `
    <h2>Example Evidence Statements</h2>

    <ul>

    ${
    info['Example evidence statements']
        .split('|')
        .map(x => `<li>${x.trim()}</li>`)
        .join('')
    }

    </ul>
    `
    :
    ''
    }

   ${
info['Learning Areas']
?
`
<h2>Learning Areas</h2>

${
info['Flowchart']
?
`
<div style="text-align:center; margin:20px 0;">

<img
src="${info['Flowchart']}"
style="
max-width:100%;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
">

</div>
`
:
''
}

<ul>

${
info['Learning Areas']
    .split('|')
    .map(x => `<li>${x.trim()}</li>`)
    .join('')
}

</ul>
`
:
''
}

</div>

`;

    }

}
  
let filtered = data;

if(strand){

filtered = filtered.filter(item => {

const primaryMatch =

item.Strand &&
item.Strand
.toLowerCase()
.trim() ===
strand.toLowerCase();

const secondaryMatch =

item['Secondary Strands'] &&

item['Secondary Strands']
.toLowerCase()
.split('|')
.map(x => x.trim())
.includes(
strand.toLowerCase()
);

return primaryMatch || secondaryMatch;

});

}

if(pathway){

filtered = filtered.filter(item =>
item.Pathway &&
item.Pathway.toLowerCase()
.includes(pathway.toLowerCase())
);

}

if(focus){

filtered = filtered.filter(item =>

item['Focus area'] &&

item['Focus area']
.toLowerCase()
.split('|')
.map(x => x.trim())
.includes(focus.toLowerCase())

);

}
    
if(pathway && !strand){

let strands = [...new Set(
  
filtered.map(item =>
item.Subject + "|" + item.Strand)

)];

let html = "";

let numberStrands =
strands.filter(x =>
x.startsWith("Number|"));

let ssmStrands =
strands.filter(x =>
x.startsWith("SSM|"));

html += `
<h2>Number</h2>
`;

numberStrands.forEach(item=>{

let parts = item.split("|");

html += `

<div class="card">

<a href="view.html?strand=${encodeURIComponent(parts[1])}&pathway=${encodeURIComponent(pathway)}">

${parts[1]}

</a>

</div>

`;

});

html += `
<h2>Shape, Space &amp; Measure</h2>
`;

ssmStrands.forEach(item=>{

let parts = item.split("|");

html += `

<div class="card">

<a href="view.html?strand=${encodeURIComponent(parts[1])}&pathway=${encodeURIComponent(pathway)}">

${parts[1]}

</a>

</div>

`;

});

container.innerHTML = html;

return;

}
  
if(cycle){

filtered = filtered.filter(item =>
item.Cycle == cycle
);

}

if(term){

filtered = filtered.filter(item =>
item.Term == term
);

}

let html = '';

const levels = [...new Set(
filtered.map(item => Number(item.Level))
)].sort((a,b)=>a-b);

const hasBelonging =
levels.some(level => level <= 3);

const hasAchievement =
levels.some(level => level >= 4 && level <= 7);

const hasCelebration =
levels.some(level => level >= 8);
    
levels.forEach(level => {

let levelTargets =
filtered.filter(item =>
Number(item.Level) === level
);

if(levelTargets.length === 0){
    return;
}

if(
hasBelonging &&
level === Math.min(
...levels.filter(x => x <= 3)
)
){

html += `
<div class="foundation-banner">

🟢 Belonging Foundations

</div>
`;

}

if(
hasAchievement &&
level === Math.min(
...levels.filter(x => x >= 4 && x <= 7)
)
){

html += `
<div class="achievement-banner">

🔵 Achievement Curriculum

</div>
`;

}

if(
hasCelebration &&
level === Math.min(
...levels.filter(x => x >= 8)
)
){

html += `
<div class="celebration-banner">

🟣 Celebration Curriculum

</div>
`;

}
    
html += `
<div class="level" id="stage${level}">

<div class="level-title">
Stage ${level}
</div>
`;

levelTargets.forEach(item=>{

let pathwayClass = 'achievement';

if(item.Pathway.toLowerCase().includes('belong')){
    pathwayClass = 'belonging';
}

if(item.Pathway.toLowerCase().includes('celebr')){
    pathwayClass = 'celebration';
}

const cycleMatch =
cycleInfo.find(c =>

(c.Pathway || '').trim() === (item.Pathway || '').trim()
&&
(c.Subject || '').trim() === (item.Subject || '').trim()
&&
(c.Strand || '').trim() === (item.Strand || '').trim()
&&
(c['Focus area'] || '').trim() === (item['Focus area'] || '').trim()

);
    
html += `

<details id="target-${item.ID}">

<summary>
${item.Target}
</summary>

<div class="content">

<p><strong>🏞 Pathway</strong></p>

<div class="section-content">
<p>${item.Pathway}</p>
</div>

${
item.Breakdown
?
`
<p><strong>🪜 Smaller Steps</strong></p>

<div class="section-content">
<p>${item.Breakdown}</p>
</div>
`
:
''
}

${
item.Emerging || item.Developing || item.Secure
?
`
<p><strong>✔️ Assessment Guidance</strong></p>

${
item.Emerging
?
`
<div class="assessment-level">
<p><strong>🟢 Emerging</strong></p>
<p>${item.Emerging}</p>
</div>
`
:
''
}

${
item.Developing
?
`
<div class="assessment-level">
<p><strong>🟡 Developing</strong></p>
<p>${item.Developing}</p>
</div>
`
:
''
}

${
item.Secure
?
`
<div class="assessment-level">
<p><strong>🔵 Secure</strong></p>
<p>${item.Secure}</p>
</div>
`
:
''
}
`
:
''
}

${
item.Activities
?
`
<p><strong>🎲 Suggested Activities</strong></p>
<div class="section-content">
<ul>
${
item.Activities
.split("|")
.map(x => `<li>${x.trim()}</li>`)
.join("")
}
</ul>
</div>
`
:
''
}

${
item.Vocab
?
`
<p><strong>🗣 Vocabulary</strong></p>

<div class="section-content">
<p>${item.Vocab.split('|').join(', ')}</p>
</div>
`
:
''
}

${
item.Resources
?
`
<p><strong>📚 Resources</strong></p>
<div class="section-content">
<p>${item.Resources}</p>
</div>
`
:
''
}

${
item['Natural Opportunities']
?
`
<p><strong>🏫 Natural Opportunities Across the School Day</strong></p>

<div class="section-content">

<ul>

${
item['Natural Opportunities']
.split('|')
.map(x =>
`<li>${x.trim()}</li>`
)
.join('')
}

</ul>

</div>
`
:
''
}

${
item['WR Year']
?
`
<p><strong>📚 National Curriculum Equivalent Stage</strong></p>

<div class="section-content">

<p>${item['WR Year']}</p>

</div>
`
:
''
}

${
item['WR Block']
?
`
<p><strong>📖 White Rose Resources</strong></p>

<div class="section-content">

${
(() => {

const blocks = (item['WR Block'] || '').split('|').map(x => x.trim());
const steps = item['WR Step'] || '';
const links = (item['WR Link'] || '').split('|').map(x => x.trim());

let html = '';

for(let i = 0; i < blocks.length; i++){

html += `

<p>

<a
href="${links[i] || ''}"
target="_blank"
style="
color:#0077B6;
text-decoration:underline;
font-weight:bold;
">

${blocks[i]}

</a>

</p>

<p>

<strong>Suggested Sections:</strong>

${steps.split('|').join(', ')}

</p>

`;

}

return html;

})()
}

</div>
`
:
''
}

${
item.Misconceptions
?
`
<p><strong>⚠️ Common Misconceptions</strong></p>
<div class="section-content">
<p>${item.Misconceptions}</p>
</div>
`
:
''
}

${
item['Linked EHCP Areas']
?
`
<p><strong>🔗 Linked EHCP Areas</strong></p>

<div class="section-content">
<ul>
${
item['Linked EHCP Areas']
.split('|')
.map(area =>
`<li>${area.trim()}</li>`
)
.join('')
}
</ul>
</div>
`
:
''
}

${
cycleMatch
?
`
<p><strong>📅 Curriculum Cycle</strong></p>

<div class="section-content">

<p>
Cycle ${cycleMatch.Cycle}
</p>

<p>
Term ${cycleMatch.Term}
</p>

</div>
`
:
''
}


${
item['Long term EHCP Target']
?
`
<p><strong>🧩 Long Term EHCP Targets</strong></p>
<div class="section-content">

${
item['Long term EHCP Target']
.split('|')
.map(target => {

const matchingStatements = data.filter(x =>

x['Long term EHCP Target']
&&
x['Long term EHCP Target']
.split('|')
.map(t => t.trim())
.includes(target.trim())

);

return `

<details>

<summary>
${target.trim()}
</summary>

<div class="target-box section-content">

<p>
<strong>📚 Associated Strands</strong>

${[...new Set(
matchingStatements.map(x => x.Strand)
)].join(', ')}
</p>

<p>
<strong>🧩 Learning Area</strong>
${item['Learning Area'] || ''}
</p>

<p>
<strong>📈 Stage Range</strong>

Stage ${Math.min(
...matchingStatements.map(x => Number(x.Level))
)}
-
Stage ${Math.max(
...matchingStatements.map(x => Number(x.Level))
)}
</p>

<p>
<strong>🎯 Associated Curriculum Statements</strong>
</p>

<ul>

${
matchingStatements
.sort((a,b)=>Number(a.Level)-Number(b.Level))
.map(x => `
<li>
Stage ${x.Level} - ${x.Target}
</li>
`)
.join('')
}

</ul>

</div>

</details>

`;

})
.join('')
}

</div>

</div>

</details>
`
:
''
}


<p><strong>🚀 Next Steps</strong></p>

<div class="section-content">

${(() => {

const currentTargets =
(item['Long term EHCP Target'] || '')
.split('|')
.map(x => x.trim())
.filter(Boolean);

let sideways = filtered.filter(x => {

if(x.ID === item.ID) return false;

if(Number(x.Level) !== Number(item.Level))
return false;

const targets =
(x['Long term EHCP Target'] || '')
.split('|')
.map(t => t.trim());

return currentTargets.some(t =>
targets.includes(t)
);

});

let forwards = filtered.filter(x => {

if(Number(x.Level) !== Number(item.Level) + 1)
return false;

const targets =
(x['Long term EHCP Target'] || '')
.split('|')
.map(t => t.trim());

return currentTargets.some(t =>
targets.includes(t)
);

});

let html = '';

sideways.sort((a,b) =>
a.Target.localeCompare(b.Target)
);

forwards.sort((a,b) =>
a.Target.localeCompare(b.Target)
);    
    
if(sideways.length){

html += `
<p><strong>➡️ Sideways</strong></p>
<ul>
`;

sideways.forEach(target => {

html += `
<li>
<a href="javascript:void(0)"
onclick="
const el =
document.getElementById('target-${target.ID}');

if(el){

el.open = true;

el.scrollIntoView({
behavior:'smooth',
block:'start'
});

}
">
${target.Target}
</a>
</li>
`;

});

html += '</ul>';

}

if(forwards.length){

html += `
<p><strong>⬆️ Forwards</strong></p>
<ul>
`;

forwards.forEach(target => {

html += `
<li>
<a href="#target-${target.ID}"
onclick="
setTimeout(() => {
const el =
document.getElementById('target-${target.ID}');
if(el) el.open = true;
},100);
">
${target.Target}
</a>
</li>
`;

});

html += '</ul>';

}

return html;

})()}

</div>
</div>

</details>

`;

});

html += '</div>';

});

document.getElementById('levelNav').innerHTML =
levels.map(level =>

`<a href="#stage${level}" class="jump">
Stage ${level}
</a>`

).join('');
container.innerHTML = html;

}
 
buildPage();

window.addEventListener('load', () => {

function openHashTarget(){

const hash = window.location.hash;

if(!hash) return;

const target =
document.querySelector(hash);

if(target){

target.open = true;

target.scrollIntoView({
behavior:'smooth',
block:'start'
});

}

}

setTimeout(openHashTarget,500);

window.addEventListener(
'hashchange',
openHashTarget
);

});

function searchTargets(){

let search =
document.getElementById('targetSearch')
.value
.toLowerCase();

document
.querySelectorAll('details')
.forEach(item=>{

if(
item.innerText
.toLowerCase()
.includes(search)
){

item.style.display='';

}
else{

item.style.display='none';

}

});

}
  
</script>

</div>  
    
<script src="sidebar.js"></script>    

</body>  
    
</html>
