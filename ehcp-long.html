<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Long-Term EHCP Targets</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="data.js"></script>

<style>

body{
font-family:Segoe UI,sans-serif;
background:#F5F7FA;
padding:30px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h1,h2,h3{
color:#003B5C;
}

details{
margin-top:10px;
}

summary{
cursor:pointer;
font-weight:bold;
}

:root{
--navy:#003B5C;
--blue:#0077B6;
--green:#5CB85C;
--purple:#7B5CB8;
--light:#F5F7FA;
}

body{
font-family:Segoe UI,sans-serif;
background:var(--light);
padding:30px;
}

.subject-heading{

background:#003B5C;
color:white;

padding:15px;

border-radius:10px;

font-size:28px;
font-weight:bold;

margin-top:30px;
margin-bottom:20px;

}

.pathway-heading{

display:inline-block;

padding:8px 15px;

background:#0077B6;
color:white;

border-radius:20px;

font-weight:bold;

margin-bottom:15px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

margin-bottom:20px;

}

.target-card{

background:white;

padding:15px;

border-radius:12px;

box-shadow:0 2px 6px rgba(0,0,0,.08);

margin-bottom:12px;

}

details{

margin-top:10px;

}

summary{

cursor:pointer;

font-weight:bold;

color:#003B5C;

}

h1{

color:#003B5C;

}

.back{

display:inline-block;

padding:10px 15px;

background:#003B5C;

color:white;

text-decoration:none;

border-radius:8px;

margin-bottom:20px;

}

.subject-buttons{

display:flex;

gap:15px;

margin-bottom:25px;

}

.subject-btn{

padding:12px 20px;

border:none;

border-radius:10px;

background:white;

cursor:pointer;

font-weight:bold;

box-shadow:0 2px 6px rgba(0,0,0,.08);

}

.subject-btn.active{

background:#003B5C;

color:white;

}  
  
</style>

</head>

<body>

<a href="index.html" class="back">
← Back to Homepage
</a>

<h1>Long-Term EHCP Target Finder</h1>

<div class="subject-buttons">

<button id="subjectBtnNumber"
class="subject-btn active"
onclick="showSubject('Number')">

Number

</button>

<button id="subjectBtnSSM"
class="subject-btn"
onclick="showSubject('SSM')">

Shape, Space & Measure

</button>

</div>

<div id="content"></div>


<script>

let allData = [];
let currentSubject = "Number";
  
async function buildPage(){

allData =
await loadCurriculum();

const params =
new URLSearchParams(window.location.search);

const selected =
params.get("target");

let html = "";

if(selected){

let matching =
allData.filter(item =>
item['Long term EHCP Target'] === selected
);

let first = matching[0];

html += `
<div class="card">

<h2>${selected}</h2>

<p><strong>Subject:</strong> ${first.Subject}</p>

<p><strong>Strand:</strong> ${first.Strand}</p>

<p><strong>Learning Area:</strong> ${first['Learning Area']}</p>

<p>
<strong>Stage Range:</strong>

${Math.min(...matching.map(x=>Number(x.Level)))}
-
${Math.max(...matching.map(x=>Number(x.Level)))}

</p>

</div>
`;

matching
.sort((a,b)=>Number(a.Level)-Number(b.Level))
.forEach(item=>{

html += `

<div class="target-card">

<details>

<summary>

Stage ${item.Level}

-

${item.Target}

</summary>

<p>

<strong>Subject:</strong>

${item.Subject}

</p>

<p>

<strong>Strand:</strong>

${item.Strand}

</p>

<p>

<strong>Learning Area:</strong>

${item['Learning Area'] || ''}

</p>

<p>

<a href="view.html?strand=${encodeURIComponent(item.Strand)}">

View full target information

</a>

</p>

</details>

</div>

`;

});

}
else{

buildOverview("Number");

}

function buildOverview(subject){

let html = '';

let rows =
allData.filter(
x => x.Subject === subject
);

let pathways =
[...new Set(
rows.map(x => x.Pathway)
)];

pathways.forEach(pathway => {

html += `
<h2>${pathway}</h2>
`;

let pathwayRows =
rows.filter(x =>
x.Pathway === pathway
);

let stages =
[...new Set(
pathwayRows.map(
x => Number(x.Level))
)]
.sort((a,b)=>a-b);

stages.forEach(stage => {

html += `
<div class="card">

<h3>
Stage ${stage}
</h3>
`;

let stageRows =
pathwayRows.filter(
x => Number(x.Level) === stage
);

let strands =
[...new Set(
stageRows.map(x => x.Strand)
)];

strands.forEach(strand => {

html += `
<h4>${strand}</h4>
`;

let targets =
[...new Set(
stageRows
.filter(x=>x.Strand===strand)
.map(
x=>x['Long term EHCP Target']
)
)];

targets.forEach(target=>{

html += `

<details>

<summary>
${target}
</summary>

`;

let matchingRows =
allData.filter(x =>
x['Long term EHCP Target'] === target
);

let minStage =
Math.min(
...matchingRows.map(
x=>Number(x.Level))
);

let maxStage =
Math.max(
...matchingRows.map(
x=>Number(x.Level))
);

html += `

<p>

<strong>Learning Area:</strong>

${matchingRows[0]['Learning Area']}

</p>

<p>

<strong>Stage Range:</strong>

${minStage}
-
${maxStage}

</p>

`;

matchingRows
.sort((a,b)=>
Number(a.Level)
-
Number(b.Level))
.forEach(row=>{

html += `

<details>

<summary>

Stage ${row.Level}

-
${row.Target}

</summary>

<p>

<a href="view.html?strand=${encodeURIComponent(row.Strand)}">

View full target information

</a>

</p>

</details>

`;

});

html += `
</details>
`;

});

});

html += `
</div>
`;

});

});

document
.getElementById('content')
.innerHTML = html;

}

}

function showSubject(subject){

currentSubject = subject;

document
.querySelectorAll('.subject-btn')
.forEach(btn =>
btn.classList.remove('active'));

document
.getElementById(
subject === 'Number'
?
'subjectBtnNumber'
:
'subjectBtnSSM'
)
.classList.add('active');

buildOverview(subject);

}

buildPage();

</script>

</body>

</html>
