<label>

class="subjectFilter"

Shape, Space & Measure
</label>

<div class="filter-group">

<h3>Pathway</h3>

<div class="checkbox-grid">

<label><input type="checkbox" class="pathwayFilter" value="Belonging" checked> Belonging</label>

<label><input type="checkbox" class="pathwayFilter" value="Achievement" checked> Achievement</label>

<label><input type="checkbox" class="pathwayFilter" value="Celebration" checked> Celebration</label>

</div>

</div>

<h3>Stage</h3>

<div class="checkbox-grid">

<label><input type="checkbox" class="stageFilter" value="1"> 1</label>
<label><input type="checkbox" class="stageFilter" value="2"> 2</label>

<label><input type="checkbox" class="stageFilter" value="4"> 4</label>
<label><input type="checkbox" class="stageFilter" value="5"> 5</label>
<label><input type="checkbox" class="stageFilter" value="6"> 6</label>
<label><input type="checkbox" class="stageFilter" value="7"> 7</label>
<label><input type="checkbox" class="stageFilter" value="8"> 8</label>
<label><input type="checkbox" class="stageFilter" value="9"> 9</label>
<label><input type="checkbox" class="stageFilter" value="10"> 10</label>

</div>

</div>

<div class="filter-group">

<h3>Strand</h3>

<div id="strandFilters" class="checkbox-grid">

Loading strands...

</div>

</div>
    
<div class="filter-group">

<h3>Search</h3>

<input
type="text"
id="searchBox"
class="search-box"
placeholder="Search EHCP targets...">

</div>

</div>

<div id="results">

</div>

</div>

<script>

let allData = [];

async function initialise(){

    allData =
    await loadCurriculum();

    buildStrandFilters();

}

function buildStrandFilters(){

let strands =
[...new Set(

allData.flatMap(row => {

let primary = row.Strand
? row.Strand.split('|')
: [];

let secondary =
row['Secondary Strands']
? row['Secondary Strands'].split('|')
: [];

return [...primary,...secondary];

})

)]
.map(x => x.trim())
.filter(Boolean)
.sort();

let html = '';

strands.forEach(strand => {

html += `

<label>

<input
type="checkbox"
class="strandFilter"
value="${strand}">

${strand}

</label>

`;

});

document
.getElementById('strandFilters')
.innerHTML = html;

}    

initialise();

</script>
