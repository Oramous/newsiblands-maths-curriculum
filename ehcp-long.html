<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Long-Term EHCP Target Finder</title>

<link rel="icon" type="image/png" href="favicon.png">
    
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="data.js"></script>

<style>

:root{
--navy:#003B5C;
--blue:#0077B6;
--green:#5CB85C;
--purple:#7B5CB8;
--light:#F5F7FA;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial, sans-serif;
}

body{
background:var(--light);
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#003B5C;
    color:white;
    position:fixed;
    height:100%;
    overflow-y:auto;
    padding:20px;
}

.logo{
    text-align:center;
}

.logo img{
    width:120px;
    margin-bottom:10px;
}

.sidebar h2{
    text-align:center;
}

.sidebar p{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    color:white;
    text-decoration:none;
    display:block;
    padding:12px;
    border-radius:8px;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.15);
}

/* MAIN */

.main{
margin-left:260px;
padding:30px;
}

.back{
display:inline-block;
padding:10px 15px;
background:var(--navy);
color:white;
text-decoration:none;
border-radius:8px;
margin-bottom:20px;
}

h1{
color:var(--navy);
margin-bottom:20px;
}

/* SUBJECT BUTTONS */

.subject-buttons{
display:flex;
gap:15px;
margin-bottom:30px;
}

.subject-btn{
padding:14px 25px;
border:none;
border-radius:10px;
background:white;
cursor:pointer;
font-size:18px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.subject-btn.active{
background:var(--navy);
color:white;
}

/* CONTENT */

.pathway-heading{

display:inline-block;

padding:8px 15px;

border-radius:20px;

margin-top:20px;
margin-bottom:15px;

font-weight:bold;
color:white;

}

.belonging-heading{
background:var(--green);
}

.achievement-heading{
background:var(--blue);
}

.celebration-heading{
background:var(--purple);
}

.stage-heading{

background:white;

padding:15px;

border-radius:10px;

margin-bottom:15px;

font-size:20px;
font-weight:bold;

color:var(--navy);

box-shadow:0 2px 6px rgba(0,0,0,.08);

}

.card{

background:white;

padding:20px;

border-radius:12px;

margin-bottom:15px;

box-shadow:0 2px 6px rgba(0,0,0,.08);

}

details{
margin-top:10px;
}

summary{
cursor:pointer;
font-weight:bold;
color:var(--navy);
padding:5px;
}

.info-row{
margin:8px 0;
}

.target-box{
background:#f8f9fb;
padding:12px;
border-radius:8px;
margin-top:10px;
}

.tag{

display:inline-block;

padding:6px 12px;

margin:3px;

background:#e6f2fb;

border-radius:20px;

}

.section-badge{

display:inline-block;

padding:6px 14px;

border-radius:20px;

font-weight:bold;

margin-top:15px;
margin-bottom:10px;

color:white;

}

.breakdown-badge{
background:#003B5C;
}

.emerging-badge{
background:#5CB85C;
}

.developing-badge{
background:#F0AD4E;
}

.secure-badge{
background:#0077B6;
}

.activities-badge{
background:#6F42C1;
}

.vocab-badge{
background:#17A2B8;
}

.resources-badge{
background:#6C757D;
}

.ehcp-badge{
background:#20C997;
}

.nextsteps-badge{
background:#8C564B;
}

.pathway{
display:inline-block;
padding:6px 14px;
border-radius:20px;
font-weight:bold;
color:white;
margin-bottom:15px;
}

.belonging{
background:var(--green);
}

.achievement{
background:var(--blue);
}

.celebration{
background:var(--purple);
}

@media(max-width:1000px){

.sidebar{
width:100%;
position:relative;
height:auto;
}

.main{
margin-left:0;
}

.subject-buttons{
flex-direction:column;
}

}

.search-box{

width:100%;

padding:15px;

border:2px solid #ddd;

border-radius:10px;

margin-bottom:25px;

font-size:16px;

background:white;

}
  
</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<img src="logo.png" alt="School Logo">

<h2>New Siblands</h2>

<p>Mathematics Curriculum</p>

</div>

<a href="index.html">🏠 Home</a>

<a href="Curriculum.html">
📚 Curriculum Documents
</a>

<a href="ehcp-long.html">
🧩 EHCP Target Finder
</a>

<a href="Assessment.html">
📊 Assessment
</a>

<a href="WhiteRose.html">
📖 White Rose Links
</a>

</div>

<div class="main">

<a href="index.html" class="back">
← Back to Homepage
</a>

<h1>Long-Term EHCP Target Finder</h1>

<div class="subject-buttons">

<button
id="subjectBtnNumber"
class="subject-btn active"
onclick="showSubject('Number')">

Number

</button>

<button
id="subjectBtnSSM"
class="subject-btn"
onclick="showSubject('SSM')">

Shape, Space & Measure

</button>

</div>

<input
type="text"
id="ehcpSearch"
class="search-box"
placeholder="Search long-term targets, strands, learning areas or short-term targets..."
onkeyup="searchEHCP()">
  
<div id="content"></div>

</div>

<script>

let allData = [];

async function buildPage(){

allData = await loadCurriculum();

showSubject('Number');

}

function showSubject(subject){

document
.querySelectorAll('.subject-btn')
.forEach(btn => btn.classList.remove('active'));

document.getElementById(
subject === 'Number'
?
'subjectBtnNumber'
:
'subjectBtnSSM'
).classList.add('active');

let html = '';

let rows =
allData.filter(
x => x.Subject === subject
);

let pathways =
[...new Set(
rows.map(x => x.Pathway)
)];

pathways.forEach(pathway => {

let pathwayClass = 'achievement-heading';

if(pathway.toLowerCase().includes('belong')){
pathwayClass = 'belonging-heading';
}

if(pathway.toLowerCase().includes('celebr')){
pathwayClass = 'celebration-heading';
}

html += `
<div class="pathway-heading ${pathwayClass}">
${pathway}
</div>
`;

let pathwayRows =
rows.filter(x =>
x.Pathway === pathway
);

let stages =
[...new Set(
pathwayRows.map(
x => Number(x.Level))
)]
.sort((a,b)=>a-b);

stages.forEach(stage => {

html += `
<div class="stage-heading">

Stage ${stage}

</div>
`;

let stageRows =
pathwayRows.filter(
x => Number(x.Level) === stage
);

let strands =
[...new Set(
stageRows.map(x => x.Strand)
)];

strands.forEach(strand => {

html += `
<div class="card ehcp-card">

<h3>${strand}</h3>
`;

let targets =
[...new Set(
stageRows
.filter(x=>x.Strand===strand)
.map(
x=>x['Long term EHCP Target']
)
)];

targets.forEach(target=>{

let matchingRows =
allData.filter(x =>
x['Long term EHCP Target'] === target
);

let minStage =
Math.min(
...matchingRows.map(
x=>Number(x.Level))
);

let maxStage =
Math.max(
...matchingRows.map(
x=>Number(x.Level))
);

html += `

<details>

<summary>

${target}

</summary>

<div class="info-row">

<strong>Learning Area:</strong>

${matchingRows[0]['Learning Area'] || ''}

</div>

<div class="info-row">

<strong>Stage Range:</strong>

Stage ${minStage}
-
Stage ${maxStage}

</div>

`;

matchingRows
.sort((a,b)=>
Number(a.Level)
-
Number(b.Level))
.forEach(row=>{

let pathwayColour = 'achievement';

if(
row.Pathway &&
row.Pathway.toLowerCase().includes('belong')
){
pathwayColour = 'belonging';
}

if(
row.Pathway &&
row.Pathway.toLowerCase().includes('celebr')
){
pathwayColour = 'celebration';
}

html += `

<details>

<summary>

Stage ${row.Level}

-

${row.Target}

</summary>

<div class="target-box">

<div class="pathway ${pathwayColour}">
${row.Pathway}
</div>

${row.Breakdown ? `
<div class="section-badge breakdown-badge">
🎯 Target Breakdown
</div>
<p>${row.Breakdown}</p>
` : ''}

${row.Emerging ? `
<div class="section-badge emerging-badge">
🟢 Emerging
</div>
<p>${row.Emerging}</p>
` : ''}

${row.Developing ? `
<div class="section-badge developing-badge">
🟡 Developing
</div>
<p>${row.Developing}</p>
` : ''}

${row.Secure ? `
<div class="section-badge secure-badge">
🔵 Secure
</div>
<p>${row.Secure}</p>
` : ''}

${row.Activities ? `
<div class="section-badge activities-badge">
🎲 Suggested Activities
</div>
<ul>
${row.Activities
.split("|")
.map(x=>`<li>${x.trim()}</li>`)
.join("")}
</ul>
` : ''}

${row.Vocab ? `
<div class="section-badge vocab-badge">
🗣 Vocabulary
</div>

${row.Vocab
.split("|")
.map(word =>
`<span class="tag">${word.trim()}</span>`)
.join("")}
` : ''}

${row.Resources ? `
<div class="section-badge resources-badge">
📚 Resources
</div>
<p>${row.Resources}</p>
` : ''}

${row['Long term EHCP Target'] ? `
<div class="section-badge ehcp-badge">
🧩 Long-Term EHCP Target
</div>
<p>${row['Long term EHCP Target']}</p>
` : ''}

${row['Next Steps within level'] ? `
<div class="section-badge nextsteps-badge">
🚀 Next Steps Within Stage
</div>
<p>${row['Next Steps within level']}</p>
` : ''}

</div>

</details>

`;

});

html += `
</details>
`;

});

html += `
</div>
`;

});

});

});

document.getElementById('content').innerHTML = html;

}

function searchEHCP(){

let search =
document.getElementById('ehcpSearch')
.value
.toLowerCase();

document
.querySelectorAll('.ehcp-card')
.forEach(card => {

if(
card.innerText
.toLowerCase()
.includes(search)
){

card.style.display = '';

}
else{

card.style.display = 'none';

}

});

}  
  
buildPage();

</script>

</body>

</html>
