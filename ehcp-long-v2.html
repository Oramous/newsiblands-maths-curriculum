<div class="filter-group">

<h3>Pathway</h3>

<div class="checkbox-grid">

<label><input type="checkbox" class="pathwayFilter" value="Belonging" > Belonging</label>

<label><input type="checkbox" class="stageFilter" value="1"> 1</label>

<label><input type="checkbox" class="stageFilter" value="4"> 4</label>
<label><input type="checkbox" class="stageFilter" value="5"> 5</label>
<label><input type="checkbox" class="stageFilter" value="6"> 6</label>
<label><input type="checkbox" class="stageFilter" value="7"> 7</label>
<label><input type="checkbox" class="stageFilter" value="8"> 8</label>
<label><input type="checkbox" class="stageFilter" value="9"> 9</label>
<label><input type="checkbox" class="stageFilter" value="10"> 10</label>

</div>

</div>

<h3>Strand</h3>

Loading strands...

</div>

</div>
    
<div class="filter-group">

<h3>Search</h3>

type="text"
id="searchBox"
class="search-box"
placeholder="Search EHCP targets...">

</div>

</div>

</div>

<script>

let allData = [];

window.allTargets = [];

async function initialise(){

    allData = await loadCurriculum();

    buildStrandFilters();

    buildResults();

    document.addEventListener(
        'change',
        applyFilters
    );

    document
        .getElementById('searchBox')
        .addEventListener(
            'input',
            applyFilters
        );
}

function buildStrandFilters(){

    let strands = [

        ...new Set(

            allData.flatMap(row => {

                const primary =
                    row.Strand
                    ? row.Strand.split('|')
                    : [];

                const secondary =
                    row['Secondary Strands']
                    ? row['Secondary Strands'].split('|')
                    : [];

                return [
                    ...primary,
                    ...secondary
                ];

            })

        )

    ]
    .map(x => x.trim())
    .filter(Boolean)
    .sort();

    let html = '';

let currentRange = '';
    
    strands.forEach(strand => {

        html += `
        <label>
            <input
                type="checkbox"
                class="strandFilter"
                value="${strand}">
            ${strand}
        </label>
        `;

    });

    document.getElementById(
        'strandFilters'
    ).innerHTML = html;

}

function buildResults(){

    let targetMap = {};

    allData.forEach(row => {

        const targetField =
            row['Long term EHCP Target'];

        if(!targetField) return;

        targetField
            .split('|')
            .map(x => x.trim())
            .filter(Boolean)
            .forEach(target => {

                if(!targetMap[target]){

                    targetMap[target] = [];

                }

                targetMap[target].push(row);

            });

    });

    window.allTargets =
    Object.entries(targetMap)
    .map(([target, rows]) => {

        const levels =
            rows
                .map(r =>
                    Number(r.Level)
                )
                .filter(x =>
                    !isNaN(x)
                );

        return {

            target,

            rows,

            minStage:
                Math.min(
                    ...levels
                ),

            maxStage:
                Math.max(
                    ...levels
                ),

            subject:
                rows[0].Subject || '',

            pathway:
                rows[0].Pathway || '',

            primaryStrand:
                rows[0].Strand || '',

            secondaryStrands:

                [...new Set(

                    rows.flatMap(r =>

                        (
                            r['Secondary Strands']
                            || ''
                        )
                        .split('|')
                        .map(x =>
                            x.trim()
                        )

                    )

                )]
                .filter(Boolean),

            learningAreas:

                [...new Set(

                    rows.flatMap(r =>

                        (
                            r['Learning Area']
                            || ''
                        )
                        .split('|')
                        .map(x =>
                            x.trim()
                        )

                    )

                )]
                .filter(Boolean),

            ehcpAreas:

                [...new Set(

                    rows.flatMap(r =>

                        (
                            r['Linked EHCP Areas']
                            || ''
                        )
                        .split('|')
                        .map(x =>
                            x.trim()
                        )

                    )

                )]
                .filter(Boolean)

        };

    })
    .sort((a,b)=>{

        if(
            a.minStage !==
            b.minStage
        ){

            return (
                a.minStage -
                b.minStage
            );

        }

        if(
            a.maxStage !==
            b.maxStage
        ){

            return (
                a.maxStage -
                b.maxStage
            );

        }

        return a.primaryStrand
            .localeCompare(
                b.primaryStrand
            );

    });

    renderTargets();

}

function renderTargets(){

    const selectedSubjects =

        [...document.querySelectorAll(
            '.subjectFilter:checked'
        )]
        .map(x => x.value);

    const selectedPathways =

        [...document.querySelectorAll(
            '.pathwayFilter:checked'
        )]
        .map(x => x.value);

    const selectedStages =

        [...document.querySelectorAll(
            '.stageFilter:checked'
        )]
        .map(x =>
            Number(x.value)
        );

    const selectedStrands =

        [...document.querySelectorAll(
            '.strandFilter:checked'
        )]
        .map(x => x.value);

    const search =

        document
        .getElementById(
            'searchBox'
        )
        .value
        .toLowerCase()
        .trim();

    let html = '';

    window.allTargets

    .filter(item => {

        if(
            selectedSubjects.length &&
            !selectedSubjects.includes(
                item.subject
            )
        ){

            return false;

        }

        if(
            selectedPathways.length &&
            !selectedPathways.includes(
                item.pathway
            )
        ){

            return false;

        }

        if(
            selectedStages.length
        ){

            const matchStage =

                selectedStages.some(
                    stage =>

                        stage >=
                        item.minStage &&

                        stage <=
                        item.maxStage
                );

            if(!matchStage)
                return false;
        }

        if(
            selectedStrands.length
        ){

            const allStrands = [

                item.primaryStrand,

                ...item.secondaryStrands

            ];

            const matchStrand =

                selectedStrands.some(
                    strand =>
                    allStrands.includes(
                        strand
                    )
                );

            if(!matchStrand)
                return false;

        }

        if(search){

            const searchText = [

                item.target,

                item.primaryStrand,

                ...item.secondaryStrands,

                ...item.rows.map(
                    r =>
                    r.Target || ''
                ),

                ...item.rows.map(
                    r =>
                    r.Breakdown || ''
                )

            ]
            .join(' ')
            .toLowerCase();

            if(
                !searchText.includes(
                    search
                )
            ){

                return false;

            }

        }

        return true;

    })

.forEach(item => {

    const range =

        item.minStage === item.maxStage
        ?
        `Stage ${item.minStage}`
        :
        `Stage ${item.minStage}-${item.maxStage}`;

    if(range !== currentRange){

        html += `
        <div class="stage-heading">
            ${range}
        </div>
        `;

        currentRange = range;

    }

            item.minStage ===
            item.maxStage

            ?

            `Stage ${item.minStage}`

            :

            `Stage ${item.minStage}-${item.maxStage}`;

        html += `

        <div class="result-card">

            <details>

                <summary>

                    <strong>
                    ${item.target}
                    </strong>

                </summary>

                <p>

                    <strong>
                    Stage Range:
                    </strong>

                    ${range}

                </p>

                <p>

                    <strong>
                    Primary Strand:
                    </strong>

                    ${item.primaryStrand}

                </p>

                ${
                    item.secondaryStrands.length
                    ?
                    `
                    <p>

                        <strong>
                        Secondary Strands:
                        </strong>

                        ${item.secondaryStrands.join(', ')}

                    </p>
                    `
                    : ''
                }

                ${
                    item.learningAreas.length
                    ?
                    `
                    <p>

                        <strong>
                        Learning Areas:
                        </strong>

                        ${item.learningAreas.join(', ')}

                    </p>
                    `
                    : ''
                }

                ${
                    item.ehcpAreas.length
                    ?
                    `
                    <p>

                        <strong>
                        Linked EHCP Areas:
                        </strong>

                        ${item.ehcpAreas.join(', ')}

                    </p>
                    `
                    : ''
                }

                <hr style="margin:15px 0;">

                <h4>
                Associated Curriculum Statements
                </h4>

        `;

        item.rows

        .sort((a,b)=>

            Number(a.Level)
            -
            Number(b.Level)

        )

        .forEach(row => {

            html += `

            <div
            style="margin-top:12px;">

                <p>

                    <strong>

                    Stage ${row.Level}

                    </strong>

                </p>

                <p>

                    ${row.Target || ''}

                </p>

                ${
                    row.Breakdown
                    ?
                    `
                    <p>

                    ${row.Breakdown}

                    </p>
                    `
                    :
                    ''
                }

            </div>

            `;

        });

        html += `

            </details>

        </div>

        `;

    });

    document
        .getElementById(
            'results'
        )
        .innerHTML = html;

}

function applyFilters(){

    renderTargets();

}

initialise();

</script>
